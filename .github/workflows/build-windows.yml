name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверки ядра
        working-directory: core
        run: python -m unittest discover -s tests -v

      - name: Библиотеки
        working-directory: desktop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Проверка окна без экрана
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_test.py

      - name: Сборка приложения
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean cyclease.spec

      - name: Упаковка
        working-directory: desktop
        shell: pwsh
        run: Compress-Archive -Path dist/KalendarDney -DestinationPath KalendarDney-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kalendar-dney-windows
          path: desktop/KalendarDney-windows.zip
