name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'core/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy собирает CPython для Android и требует host-Python 3.10
      # того же минорного номера, что и целевая версия.
      - name: Set up build Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Ядро календаря проверяем до сборки: если расчёт сломан, APK собирать
      # незачем.
      - name: Run core tests
        working-directory: core
        run: python -m unittest discover -s tests

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calendar-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
